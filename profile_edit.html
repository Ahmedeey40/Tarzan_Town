<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-blue-900 p-6 min-h-screen text-white">

 <div class="max-w-3xl mx-auto my-10 bg-gradient-to-br from-blue-900 via-blue-800 to-blue-700 shadow-2xl p-8 rounded-2xl border border-blue-600">
  <h2 class="text-3xl md:text-4xl font-extrabold mb-8 text-white text-center drop-shadow-md">Edit Your Profile</h2>

  <form id="profileForm" class="space-y-6">
    <!-- Name -->
    <div>
      <label class="block mb-2 text-blue-200 font-semibold">Name</label>
      <input
        type="text"
        id="editName"
        class="w-full border border-blue-600 bg-blue-950/60 p-3 rounded-lg text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
        placeholder="Enter your name"
      />
    </div>

    <!-- Profile Image -->
    <div class="text-center">
      <label class="block mb-2 text-blue-200 font-semibold text-left">Profile Image</label>
      <input type="file" id="profileImageFile" accept="image/*" class="text-blue-100 mb-3" />
      <img
        id="profileImagePreview"
        src=""
        alt="Profile Preview"
        class="w-32 h-32 rounded-full object-cover border-4 border-blue-400 mx-auto shadow-lg"
      />
    </div>

    <!-- Footer Name -->
    <div>
      <label class="block mb-2 text-blue-200 font-semibold">Footer Name</label>
      <input
        type="text"
        id="footerNameInput"
        class="w-full border border-blue-600 bg-blue-950/60 p-3 rounded-lg text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
        placeholder="Enter footer name"
      />
    </div>

    <!-- Social Links -->
    <div class="grid md:grid-cols-2 gap-6">
      <div>
        <label class="block mb-2 text-blue-200 font-semibold">Facebook URL</label>
        <input
          type="text"
          id="facebookURL"
          class="w-full border border-blue-600 bg-blue-950/60 p-3 rounded-lg text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="Facebook link"
        />
      </div>

      <div>
        <label class="block mb-2 text-blue-200 font-semibold">Twitter URL</label>
        <input
          type="text"
          id="twitterURL"
          class="w-full border border-blue-600 bg-blue-950/60 p-3 rounded-lg text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="Twitter link"
        />
      </div>

      <div>
        <label class="block mb-2 text-blue-200 font-semibold">Telegram URL</label>
        <input
          type="text"
          id="telegramURL"
          class="w-full border border-blue-600 bg-blue-950/60 p-3 rounded-lg text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="Telegram link"
        />
      </div>

      <div>
        <label class="block mb-2 text-blue-200 font-semibold">TikTok URL</label>
        <input
          type="text"
          id="tiktokURL"
          class="w-full border border-blue-600 bg-blue-950/60 p-3 rounded-lg text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="TikTok link"
        />
      </div>
    </div>

    <hr class="my-8 border-blue-600 opacity-40" />

    <h3 class="text-2xl md:text-3xl font-semibold mb-6 text-white text-center">Work Section (Images + Text)</h3>

    <!-- Work Sections -->
    <div class="space-y-10">
      <!-- Work Item Template -->
      <div>
        <label class="block mb-2 text-blue-200 font-semibold">Work 1 Image</label>
        <input type="file" id="work1ImageFile" accept="image/*" class="text-blue-100 mb-3" />
        <img
          id="work1ImagePreview"
          src=""
          alt="Work 1 Preview"
          class="w-full h-44 object-cover rounded-lg mb-4 border-4 border-blue-400 shadow-md"
        />
        <input
          type="text"
          id="work1Text"
          class="w-full border border-blue-600 bg-blue-950/60 p-3 rounded-lg text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="Work 1 description"
        />
      </div>

      <div>
        <label class="block mb-2 text-blue-200 font-semibold">Work 2 Image</label>
        <input type="file" id="work2ImageFile" accept="image/*" class="text-blue-100 mb-3" />
        <img
          id="work2ImagePreview"
          src=""
          alt="Work 2 Preview"
          class="w-full h-44 object-cover rounded-lg mb-4 border-4 border-blue-400 shadow-md"
        />
        <input
          type="text"
          id="work2Text"
          class="w-full border border-blue-600 bg-blue-950/60 p-3 rounded-lg text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="Work 2 description"
        />
      </div>

      <div>
        <label class="block mb-2 text-blue-200 font-semibold">Work 3 Image</label>
        <input type="file" id="work3ImageFile" accept="image/*" class="text-blue-100 mb-3" />
        <img
          id="work3ImagePreview"
          src=""
          alt="Work 3 Preview"
          class="w-full h-44 object-cover rounded-lg mb-4 border-4 border-blue-400 shadow-md"
        />
        <input
          type="text"
          id="work3Text"
          class="w-full border border-blue-600 bg-blue-950/60 p-3 rounded-lg text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="Work 3 description"
        />
      </div>
    </div>

    <!-- Buttons -->
    <button
      type="submit"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-all duration-300 shadow-lg hover:shadow-xl"
    >
      Save Changes
    </button>
  </form>

  <button
    id="logoutBtn"
    class="w-full mt-4 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition-all duration-300 shadow-md hover:shadow-lg"
  >
    Logout
  </button>
</div>

  <script>
    // Helper to convert image file to Base64 string
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    // Show preview image from file input
    function setupImagePreview(fileInputId, imgPreviewId) {
      const fileInput = document.getElementById(fileInputId);
      const imgPreview = document.getElementById(imgPreviewId);

      fileInput.addEventListener('change', async () => {
        if (fileInput.files && fileInput.files[0]) {
          const base64 = await fileToBase64(fileInput.files[0]);
          imgPreview.src = base64;
        }
      });
    }

    // Setup previews for all images
    setupImagePreview('profileImageFile', 'profileImagePreview');
    setupImagePreview('work1ImageFile', 'work1ImagePreview');
    setupImagePreview('work2ImageFile', 'work2ImagePreview');
    setupImagePreview('work3ImageFile', 'work3ImagePreview');

    const loggedInEmail = localStorage.getItem('loggedInUserEmail');
    if (!loggedInEmail) {
      window.location.href = '/index';
    }

    const users = JSON.parse(localStorage.getItem('usersDB')) || [];
    const currentUserIndex = users.findIndex(u => u.email === loggedInEmail);
    if (currentUserIndex === -1) {
      alert('User data not found.');
      window.location.href = '/dashboard';
    }
    const user = users[currentUserIndex];

    // Fill form inputs with existing data
    document.getElementById('editName').value = user.username || '';
    document.getElementById('footerNameInput').value = user.footerName || '';
    document.getElementById('facebookURL').value = user.facebookURL || '';
    document.getElementById('twitterURL').value = user.twitterURL || '';
    document.getElementById('telegramURL').value = user.telegramURL || '';
    document.getElementById('tiktokURL').value = user.tiktokURL || '';

    // Show images previews if saved as Base64 strings
    if (user.profileImageBase64) {
      document.getElementById('profileImagePreview').src = user.profileImageBase64;
    }
    if (user.work1ImageBase64) {
      document.getElementById('work1ImagePreview').src = user.work1ImageBase64;
    }
    if (user.work2ImageBase64) {
      document.getElementById('work2ImagePreview').src = user.work2ImageBase64;
    }
    if (user.work3ImageBase64) {
      document.getElementById('work3ImagePreview').src = user.work3ImageBase64;
    }

    // Fill work texts
    document.getElementById('work1Text').value = user.work1Text || '';
    document.getElementById('work2Text').value = user.work2Text || '';
    document.getElementById('work3Text').value = user.work3Text || '';

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Get values from inputs
      const username = document.getElementById('editName').value.trim();
      if (!username) {
        alert('Name is required');
        return;
      }

      const footerName = document.getElementById('footerNameInput').value.trim();
      const facebookURL = document.getElementById('facebookURL').value.trim();
      const twitterURL = document.getElementById('twitterURL').value.trim();
      const telegramURL = document.getElementById('telegramURL').value.trim();
      const tiktokURL = document.getElementById('tiktokURL').value.trim();

      const work1Text = document.getElementById('work1Text').value.trim();
      const work2Text = document.getElementById('work2Text').value.trim();
      const work3Text = document.getElementById('work3Text').value.trim();

      // For images: check if new image selected, if yes, convert to Base64, else keep old one
      async function getImageBase64OrOld(fileInputId, oldBase64) {
        const fileInput = document.getElementById(fileInputId);
        if (fileInput.files && fileInput.files[0]) {
          return await fileToBase64(fileInput.files[0]);
        }
        return oldBase64 || '';
      }

      const profileImageBase64 = await getImageBase64OrOld('profileImageFile', user.profileImageBase64);
      const work1ImageBase64 = await getImageBase64OrOld('work1ImageFile', user.work1ImageBase64);
      const work2ImageBase64 = await getImageBase64OrOld('work2ImageFile', user.work2ImageBase64);
      const work3ImageBase64 = await getImageBase64OrOld('work3ImageFile', user.work3ImageBase64);

      // Update user data in usersDB
      users[currentUserIndex] = {
        ...users[currentUserIndex],
        username,
        footerName,
        facebookURL,
        twitterURL,
        telegramURL,
        tiktokURL,
        profileImageBase64,
        work1ImageBase64,
        work2ImageBase64,
        work3ImageBase64,
        work1Text,
        work2Text,
        work3Text,
      };

      localStorage.setItem('usersDB', JSON.stringify(users));

      alert('Profile updated successfully!');
      window.location.href = '/user_dashboard'; // Adjust if needed
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('loggedInUserEmail');
      window.location.href = '/index';
    });
  </script>

</body>
</html>
